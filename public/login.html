<!doctype html>
<html lang="id">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Masuk Staf — Fajar Timur Coffee</title><link rel="icon" href="/img/logo.svg">
        <link rel="stylesheet" href="/css/app.css">
    </head>
<body>
<main class="lg">
<section class="lg-art"><div class="lg-copy"><img src="/img/logo.svg" alt="" width="52" height="52"><p class="brand">Fajar Timur Coffee</p><h2>Sistem Pemesanan Berbasis Kode QR</h2><p>Kelola pesanan, menu, pembayaran, dan laporan penjualan dalam satu tempat.</p></div></section>
<section class="lg-form"><form id="f" class="card"><h1>Masuk</h1><p class="muted">Owner, Admin, dan Kasir</p><div id="msg" class="err hidden" role="alert"></div>
<label for="u">Username</label><input id="u" autocomplete="username" required autofocus>
<label for="p">Password</label><input id="p" type="password" autocomplete="current-password" required>
<p><button class="btn" style="width:100%">Masuk</button></p></form></section>
</main>
<script src="/js/common.js"></script><script src="/js/login.js"></script></body></html>
